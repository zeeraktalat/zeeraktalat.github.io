<div class="row g-5 mb-5">
  <div>
    <br />
    <h4 class="fw-bold border-bottom pb-3 mb-5">Contact Information</h4>
    {% for contact in site.data.settings.contacts %}
    <div class="row g-5 mb-5 ">
      <div class="col-lg-10">
        <h5>{{ contact.name }}</h5>
        <p>{{ contact.title }}<br />
          {{ contact.department }} <br />
        {{ contact.institution }} | {{ contact.institution_address }}</p>
        <!-- <p>Phone: {{ contact.phone }}</p> -->
        <p><b>Email:</b> {{ contact.email }} <br />
        <b>Office:</b> {{ contact.office }}</p>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
